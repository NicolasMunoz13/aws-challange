apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: sentinel
  labels:
    app: backend
  annotations:
    # classic ELB, not nlb, on purpose: NLB instance targets always preserve client IP, and AWS
    # doesn't support that for clients reaching the LB over a VPC peering connection, which is
    # exactly the gateway's path here. classic ELB proxies the connection instead of passing it
    # through, so it works fine across peering
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
