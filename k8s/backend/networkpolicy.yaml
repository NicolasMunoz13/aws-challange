apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-from-vpc-only
  namespace: sentinel
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: REPLACE_BACKEND_VPC_CIDR
      ports:
        - protocol: TCP
          port: 8080
