apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: sentinel
  labels:
    app: gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
